name: TypeScript Toolchain Update

on:
  schedule:
    - cron: "0 16 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize so a scheduled run and a manual dispatch don't fight over the
# same automation branch.
concurrency:
  group: typescript-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
      - id: install
        run: node scripts/update-diagnostics.mjs run install -- npm ci

      - name: Run static JS checks
        id: lint
        run: node scripts/update-diagnostics.mjs run lint -- npm run lint

      - name: Pin latest TypeScript toolchain
        id: update-toolchain
        run: node scripts/update-diagnostics.mjs run update-toolchain -- npm run update:typescript-toolchain

      - name: Verify pinned web-features dataset
        id: verify-dataset
        run: node scripts/update-diagnostics.mjs run verify-dataset -- npm run verify:dataset

      - name: Regenerate baseline
        id: generate
        run: node scripts/update-diagnostics.mjs run generate -- npm run generate

      - name: Run standalone validation
        id: test
        run: node scripts/update-diagnostics.mjs run test -- npm test

      - name: Checkout updated TypeScript source
        id: checkout-typescript
        run: node scripts/update-diagnostics.mjs run checkout-typescript -- npm run checkout:typescript-source -- --out .tmp/TypeScript --force

      - name: Read required Go version
        id: go-version
        run: echo "version=$(awk '/^go / { print $2; exit }' .tmp/TypeScript/tsc/go.mod)" >> "$GITHUB_OUTPUT"

      - id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "${{ steps.go-version.outputs.version }}"
          cache-dependency-path: .tmp/TypeScript/tsc/go.sum

      - name: Test updated TypeScript source
        id: integration
        run: node scripts/update-diagnostics.mjs run integration -- npm run test:typescript:gate -- --typescript-dir ./.tmp/TypeScript

      - name: Check latest TypeScript major against the peer range
        id: peer-range
        run: node scripts/update-diagnostics.mjs run peer-range -- npm run check:typescript-peer-latest

      - name: Prepare pull request body
        id: pr-body
        run: node scripts/update-diagnostics.mjs run pr-body -- npm run write:update-pr-body -- --out .tmp/typescript-toolchain-update-pr.md --summary-out .tmp/typescript-toolchain-update-summary.json

      - name: Write update diagnostics
        if: always()
        env:
          UPDATE_WORKFLOW_STEPS: ${{ toJSON(steps) }}
        run: node scripts/update-diagnostics.mjs report

      # By GitHub design, PRs opened with the default GITHUB_TOKEN don't trigger
      # any pull_request workflow (validate / test-typescript / package-dry-run).
      # Set AUTOMATION_TOKEN (a fine-grained PAT or GitHub App token) to run CI
      # on bot PRs too.
      - name: Warn when AUTOMATION_TOKEN is not configured
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            message="AUTOMATION_TOKEN is not set, so PRs created by this workflow won't run pull_request CI automatically. Register a fine-grained PAT (contents: write / pull-requests: write) as AUTOMATION_TOKEN in the repository secrets."
            echo "::warning title=CI won't run on bot PRs::${message}"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> ${message}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          branch: automation/weekly-typescript-toolchain-update
          delete-branch: true
          commit-message: "chore: update TypeScript toolchain snapshot"
          title: "chore: update TypeScript toolchain snapshot"
          body-path: .tmp/typescript-toolchain-update-pr.md

      - name: Upload update diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-diagnostics
          path: .tmp/update-diagnostics
          include-hidden-files: true
          if-no-files-found: error
